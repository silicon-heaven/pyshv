stages:
  - devenv
  - test
  - lint
  - style
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

variables:
  GIT_DEPTH: 0

.nix:
  image: registry.gitlab.com/cynerd/gitlab-ci-nix
  tags:
    - docker
  cache:
    key: "nix"
    paths:
      - ".nix-cache"
  before_script:
    - gitlab-ci-nix-cache-before
  after_script:
    - gitlab-ci-nix-cache-after

## Development environment #####################################################
devenv:
  stage: devenv
  extends: .nix
  script:
    - nix develop -c true

## Test stage ##################################################################
.test:
  stage: test
  extends: .nix
  needs: ["devenv"]

tests:
  extends: .test
  script:
    - nix develop --quiet -c pytest -v --junitxml=report.xml --cov=. --cov-report xml:coverage.xml --cov-report html:coverage --cov-report term
  artifacts:
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - 'coverage/'
  coverage: '/^TOTAL.*\s+([^\s]+)%$/'

nix-build:
  extends: .test
  script:
    - nix build

nix-check:
  extends: .test
  script:
    - nix flake check

docs:
  extends: .test
  allow_failure: true
  script:
    - nix develop --quiet -c sphinx-build --nitpicky --fail-on-warning docs html

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

## Linters #####################################################################
.lint:
  stage: lint
  extends: .nix
  needs: ["devenv"]

lint:
  extends: .lint
  script:
    - nix run --quiet .#ruff -- check .

mypy:
  extends: .lint
  script:
    - mkdir .mypy-cache
    - nix develop --quiet -c mypy --cache-dir .mypy-cache .

shellcheck:
  extends: .lint
  script:
    - git ls-files '**.sh' | xargs nix run --quiet .#shellcheck

sphinx-lint:
  extends: .lint
  script: |
      git ls-files '**.rst' '**.py' |
        xargs nix run --quiet .#sphinx-lint -- --max-line-length 88 --enable all

statix:
  extends: .lint
  script:
    - nix run --quiet .#statix -- check .

## Style stage #################################################################
.style:
  stage: style
  extends: .nix
  needs: ["devenv"]
  allow_failure: true

format:
  extends: .style
  script:
    - nix run --quiet .#ruff -- format --diff .
    - nix run --quiet .#ruff -- check --diff .

shell-format:
  extends: .style
  script:
    - git ls-files '**.sh' | xargs nix run --quiet .#shfmt -- -w
    - git diff --exit-code

docstrfmt:
  extends: .style
  script:
    - |
      git ls-files '**.rst' '**.py' |
        xargs nix run --quiet .#docstrfmt -- --no-docstring-trailing-line
    - git diff --exit-code

nixfmt:
  extends: .style
  script:
    - nix fmt .
    - git diff --exit-code

deadnix:
  extends: .style
  script:
    - nix run --quiet .#deadnix -- --fail .

editorconfig-checker:
  extends: .style
  script:
    - nix run --quiet .#editorconfig-checker -- -exclude '.nix-cache/.*'

gitlint:
  extends: .style
  script:
    - git fetch
    - nix run --quiet .#gitlint -- --commits origin/master..$CI_COMMIT_SHA

## Release creation ############################################################
.deploy:
  stage: deploy
  extends: .nix
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: tests
      artifacts: false

release:
  extends: .deploy
  script:
    - nix develop --quiet -c ./release.sh

pages:
  stage: deploy
  extends: .nix
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  needs: ["devenv"]
  script:
    - nix profile add .#fdupes
    - bash docs/pages.sh public
  artifacts:
    paths:
    - public
