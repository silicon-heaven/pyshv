[project]
name = "project-template-python"
version = "0.0.0"
description = "Project Template Python"
readme = "README.rst"
authors = [
  { name="Elektroline a.s." },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
source = "https://gitlab.elektroline.cz/emb/template/python"
changelog = "https://gitlab.elektroline.cz/emb/template/python/-/blob/master/CHANGELOG.md"
issues = "https://gitlab.elektroline.cz/emb/template/python/-/issues"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
]
docs = [
  "sphinx",
  "sphinx-book-theme",
  "sphinx-mdinclude",
]

[project.scripts]
template_package_name = "template_package_name.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["docs", "tests*"]
[tool.setuptools.package-data]
"*" = ["py.typed"]
[tool.setuptools.cmdclass]
build_py = "template_package_name.__setuptools__.BuildPy"

[tool.coverage.run]
branch = true
omit = ["template_package_name/__setuptools__.py", "tests/*"]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if typing.TYPE_CHECKING:"
]

[tool.ruff.lint]
select = [
  "F", "E", "W", "I", "N", "D", "UP", "YTT", "ANN", "ASYNC", "ASYNC1", "S", "BLE",
  "B", "A", "COM", "PL", "RUF"
]
ignore = [
  # Magic methods have defined behavior so what is there to document. __init__
  # should be documented in class docstring.
  "undocumented-magic-method", "undocumented-public-init",
  # These have conflicting rules.
  "incorrect-blank-line-before-class", "multi-line-summary-second-line",
  # Ignore too long lines (format tackles that)
  "line-too-long",
  # It is nice that assert should not be used for input checking but it can be
  # also used for internal consistency checking.
  "assert", "assert-false",
  # subprocess can be insecurely used but not is insecure by design
  "suspicious-subprocess-import", "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  # Catching Exception is valid and safe in some cases and thus should be allowed
  "blind-except",
  # Conflict with formatter
  "missing-trailing-comma",
  # Remove too-many limit for more complex code.
  "too-many-public-methods", "too-many-return-statements", "too-many-branches",
  "too-many-arguments", "too-many-positional-arguments",
  "magic-value-comparison", "too-many-nested-blocks",
  # This seems like a wrong rule
  "eq-without-hash",
]
preview = true
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "undocumented-public-module", "undocumented-public-class",
  "undocumented-public-method", "undocumented-public-function",
  "undocumented-public-package", "assert", "hardcoded-password-func-arg",
  "missing-type-function-argument", "missing-type-args",
  "missing-type-kwargs", "missing-return-type-undocumented-public-function",
  "missing-return-type-private-function", "missing-return-type-special-method",
  "missing-return-type-static-method", "no-self-use",
]
"docs/conf.py" = [
  "undocumented-public-module", "undocumented-public-function",
  "builtin-variable-shadowing",
  "missing-return-type-undocumented-public-function",
  "missing-type-function-argument"
]
[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
