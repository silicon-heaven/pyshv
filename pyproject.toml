[project]
name = "pyshv"
version = "0.13.1"
description = "Pure Python SHV implementation"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name="Elektroline a.s." },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Topic :: Home Automation",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
requires-python = ">=3.12"

[project.urls]
"Homepage" = "https://gitlab.com/silicon-heaven/pyshv"
"Bug Tracker" = "https://gitlab.com/silicon-heaven/pyshv/-/issues"
"Github" = "https://github.com/silicon-heaven/libshv-py"

[project.optional-dependencies]
websockets = ["websockets >= 13.0"]
canbus = ["python-can"]
extra = ["asyncinotify; sys_platform == \"linux\""]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
]
docs = [
  "sphinx",
  "sphinx-book-theme",
  "sphinx-mdinclude",
  "sphinx-multiversion",
]

[project.scripts]
pycpconv = "shv.cpconv.__main__:main"
pyshvbroker = "shv.broker.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["docs", "tests*"]
[tool.setuptools.package-data]
"*" = ["py.typed"]
[tool.setuptools.cmdclass]
build_py = "shv.__setuptools__.BuildPy"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = ["tests/*", "shv/__setuptools__.py"]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if typing.TYPE_CHECKING:",
    "@typing.overload",
]

[tool.ruff.lint]
select = [
  "F", "E", "W", "I", "N", "D", "UP", "YTT", "ANN", "ASYNC", "ASYNC1", "S", "BLE",
  "B", "A", "COM", "PL", "RUF"
]
ignore = [
  # Magic methods have defined behavior so what is there to document. __init__
  # should be documented in class docstring.
  "undocumented-magic-method", "undocumented-public-init",
  # These have conflicting rules.
  "incorrect-blank-line-before-class", "multi-line-summary-second-line",
  # Ignore too long lines (format tackles that)
  "line-too-long",
  # It is nice that assert should not be used for input checking but it can be
  # also used for internal consistency checking.
  "assert", "assert-false",
  # subprocess can be insecurely used but not is insecure by design
  "suspicious-subprocess-import", "subprocess-without-shell-equals-true",
  "start-process-with-partial-path",
  # Catching Exception is valid and safe in some cases and thus should be allowed
  "blind-except",
  # Relative imports can't be mixed up
  "stdlib-module-shadowing",
  # Conflict with formatter
  "missing-trailing-comma",
  # Remove too-many limit for more complex code.
  "too-many-public-methods", "too-many-return-statements", "too-many-branches",
  "too-many-arguments", "too-many-positional-arguments",
  "magic-value-comparison", "too-many-nested-blocks", "too-many-statements",
  "too-many-boolean-expressions",
  # This seems like a wrong rule
  "eq-without-hash",
]
preview = true
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "undocumented-public-module", "undocumented-public-class",
  "undocumented-public-method", "undocumented-public-function",
  "undocumented-public-package", "assert", "hardcoded-password-func-arg",
  "missing-type-function-argument", "missing-type-args",
  "missing-type-kwargs", "missing-return-type-undocumented-public-function",
  "missing-return-type-private-function", "missing-return-type-special-method",
  "missing-return-type-static-method", "no-self-use",
]
"docs/conf.py" = [
  "undocumented-public-module", "undocumented-public-function",
  "builtin-variable-shadowing",
  "missing-return-type-undocumented-public-function",
  "missing-type-function-argument"
]
[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
